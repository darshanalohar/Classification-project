<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Iris Flower Classification
    </title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            padding: 0;

            min-height: 100vh;

            font-family: Arial, sans-serif;

            background: linear-gradient(
                135deg,
                #e0f2fe,
                #f5f3ff
            );

            display: flex;

            justify-content: center;

            align-items: center;

        }


        .container {

            width: 480px;

            background: white;

            padding: 35px;

            border-radius: 15px;

            box-shadow:
                0 10px 30px
                rgba(0, 0, 0, 0.15);

        }


        h1 {

            text-align: center;

            color: #4338ca;

            margin-bottom: 10px;

            font-size: 28px;

        }


        .subtitle {

            text-align: center;

            color: #64748b;

            font-size: 14px;

            margin-bottom: 25px;

        }


        label {

            display: block;

            margin-top: 15px;

            margin-bottom: 6px;

            font-weight: bold;

            color: #334155;

        }


        input {

            width: 100%;

            padding: 12px;

            border: 1px solid #cbd5e1;

            border-radius: 7px;

            font-size: 15px;

            outline: none;

        }


        input:focus {

            border-color: #6366f1;

        }


        button {

            width: 100%;

            padding: 13px;

            margin-top: 25px;

            border: none;

            border-radius: 7px;

            background: #4f46e5;

            color: white;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;

        }


        button:hover {

            background: #3730a3;

        }


        .result {

            margin-top: 25px;

            padding: 20px;

            background: #ecfdf5;

            border: 1px solid #86efac;

            border-radius: 8px;

            text-align: center;

        }


        .result-title {

            color: #166534;

            font-size: 15px;

            margin-bottom: 8px;

        }


        .result-value {

            color: #15803d;

            font-size: 24px;

            font-weight: bold;

        }


        .error {

            margin-top: 20px;

            padding: 12px;

            background: #fee2e2;

            border: 1px solid #fca5a5;

            color: #991b1b;

            border-radius: 7px;

            text-align: center;

        }


        .footer {

            margin-top: 20px;

            text-align: center;

            color: #94a3b8;

            font-size: 12px;

        }

    </style>

</head>


<body>


<div class="container">


    <h1>
        🌸 Iris Flower Classification
    </h1>


    <div class="subtitle">

        K-Nearest Neighbors (KNN)

    </div>


    <form
        action="/predict"
        method="POST"
    >


        <!-- Sepal Length -->

        <label>
            Sepal Length (cm)
        </label>

        <input
            type="number"
            name="sepal_length"
            step="0.1"
            min="0"
            placeholder="Example: 5.1"
            required
        >


        <!-- Sepal Width -->

        <label>
            Sepal Width (cm)
        </label>

        <input
            type="number"
            name="sepal_width"
            step="0.1"
            min="0"
            placeholder="Example: 3.5"
            required
        >


        <!-- Petal Length -->

        <label>
            Petal Length (cm)
        </label>

        <input
            type="number"
            name="petal_length"
            step="0.1"
            min="0"
            placeholder="Example: 1.4"
            required
        >


        <!-- Petal Width -->

        <label>
            Petal Width (cm)
        </label>

        <input
            type="number"
            name="petal_width"
            step="0.1"
            min="0"
            placeholder="Example: 0.2"
            required
        >


        <!-- Predict Button -->

        <button type="submit">

            Predict Flower

        </button>


    </form>


    <!-- Prediction -->

    {% if prediction %}

    <div class="result">

        <div class="result-title">

            Predicted Iris Species

        </div>

        <div class="result-value">

            {{ prediction }}

        </div>

    </div>

    {% endif %}


    <!-- Error -->

    {% if error %}

    <div class="error">

        Error: {{ error }}

    </div>

    {% endif %}


    <div class="footer">

        AI Mini Project |
        K-Nearest Neighbors

    </div>


</div>


</body>

</html>
